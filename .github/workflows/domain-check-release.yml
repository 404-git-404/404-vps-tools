name: Domain check release

on:
  push:
    tags:
      - domain-check-v*

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
      - name: Validate production tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^domain-check-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Test
        run: |
          test -z "$(gofmt -l cmd internal)"
          go test ./...
          go test -race ./...
          go vet ./...
      - name: Build release
        run: |
          mkdir -p dist
          version=${GITHUB_REF_NAME#domain-check-}
          build_date=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.version=$version -X main.commit=$GITHUB_SHA -X main.buildDate=$build_date" \
              -o "dist/domain-check-linux-$arch" ./cmd/domain-check
          done
          file dist/domain-check-linux-* | tee /tmp/domain-check-file
          test "$(grep -c 'ELF 64-bit.*statically linked' /tmp/domain-check-file)" -eq 2
          test "$(./dist/domain-check-linux-amd64 --version)" = \
            "domain-check Go $version (commit $GITHUB_SHA, built $build_date)"
          (cd dist && sha256sum domain-check-linux-amd64 domain-check-linux-arm64 > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/domain-check-linux-amd64 \
            dist/domain-check-linux-arm64 \
            dist/SHA256SUMS \
            --verify-tag \
            --title "domain-check ${GITHUB_REF_NAME#domain-check-}" \
            --generate-notes \
            --latest
      - name: Verify production installer
        run: |
          sudo bash -c 'set -Eeuo pipefail; case "$(uname -m)" in x86_64) arch=amd64 ;; aarch64|arm64) arch=arm64 ;; *) printf "Unsupported architecture: %s\n" "$(uname -m)" >&2; exit 1 ;; esac; asset="domain-check-linux-$arch"; base="https://github.com/404-git-404/404notfound/releases/latest/download"; dir=$(mktemp -d); trap '\''rm -rf -- "$dir"'\'' EXIT; curl -fsSL "$base/$asset" -o "$dir/$asset"; curl -fsSL "$base/SHA256SUMS" -o "$dir/SHA256SUMS"; checksum=$(grep -E "^[[:xdigit:]]{64}  ${asset}$" "$dir/SHA256SUMS"); printf "%s\n" "$checksum" | (cd "$dir" && sha256sum --check --status -); install -m 0755 "$dir/$asset" /usr/local/bin/domain-check; /usr/local/bin/domain-check --version'
          file /usr/local/bin/domain-check | grep -E 'ELF 64-bit.*statically linked'
          /usr/local/bin/domain-check --version | grep -F "domain-check Go ${GITHUB_REF_NAME#domain-check-}"
