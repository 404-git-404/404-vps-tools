name: Domain check release

on:
  push:
    tags:
      - domain-check-v*

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
      - name: Validate production tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^domain-check-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Test
        run: |
          test -z "$(gofmt -l cmd internal)"
          go test ./...
          go test -race ./...
          go vet ./...
      - name: Build release
        run: |
          mkdir -p dist
          version=${GITHUB_REF_NAME#domain-check-}
          build_date=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.version=$version -X main.commit=$GITHUB_SHA -X main.buildDate=$build_date" \
              -o "dist/domain-check-linux-$arch" ./cmd/domain-check
          done
          file dist/domain-check-linux-* | tee /tmp/domain-check-file
          test "$(grep -c 'ELF 64-bit.*statically linked' /tmp/domain-check-file)" -eq 2
          test "$(./dist/domain-check-linux-amd64 --version)" = \
            "domain-check Go $version (commit $GITHUB_SHA, built $build_date)"
          (cd dist && sha256sum domain-check-linux-amd64 domain-check-linux-arm64 > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/domain-check-linux-amd64 \
            dist/domain-check-linux-arm64 \
            dist/SHA256SUMS \
            --verify-tag \
            --title "domain-check ${GITHUB_REF_NAME#domain-check-}" \
            --generate-notes \
            --latest=false
      - name: Publish domain-check stable alias
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stable_tag=domain-check-latest
          version=${GITHUB_REF_NAME#domain-check-}
          title="domain-check stable ($version)"
          notes="Stable domain-check download alias for $GITHUB_REF_NAME at commit $GITHUB_SHA."
          if gh release view "$stable_tag" >/dev/null 2>&1; then
            gh release upload "$stable_tag" \
              dist/domain-check-linux-amd64 \
              dist/domain-check-linux-arm64 \
              --clobber
            gh release upload "$stable_tag" dist/SHA256SUMS --clobber
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/$stable_tag" \
              -f sha="$GITHUB_SHA" -F force=true
            gh release edit "$stable_tag" --title "$title" --notes "$notes"
          else
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$stable_tag" \
              >/dev/null 2>&1; then
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/git/refs/tags/$stable_tag"
            fi
            gh release create "$stable_tag" \
              dist/domain-check-linux-amd64 \
              dist/domain-check-linux-arm64 \
              dist/SHA256SUMS \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --latest=false
          fi
      - name: Verify published installer on GNU and BusyBox
        run: |
          installer=$(grep -F "bash -c 'set -Eeuo pipefail;" README.md)
          test "$(printf '%s\n' "$installer" | wc -l)" -eq 1
          for image in debian:12-slim alpine:3.21; do
            docker run --rm \
              -e INSTALLER="$installer" \
              -e EXPECTED_VERSION="${GITHUB_REF_NAME#domain-check-}" \
              "$image" sh -euxc '
                if command -v apk >/dev/null 2>&1; then
                  apk add --no-cache bash ca-certificates curl
                  bash -c "$INSTALLER"
                else
                  apt-get update
                  apt-get install --yes --no-install-recommends bash ca-certificates coreutils curl
                  bash -c "$INSTALLER"
                fi
                /usr/local/bin/domain-check --version |
                  grep -F "domain-check Go $EXPECTED_VERSION (commit"
              '
          done
