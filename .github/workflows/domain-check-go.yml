name: Domain check Go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
      - name: Format check
        run: test -z "$(gofmt -l cmd internal)"
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build static Linux binaries
        run: |
          mkdir -p dist
          version=v0.0.0-test
          commit=0123456789abcdef
          build_date=2026-08-14T00:00:00Z
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.version=$version -X main.commit=$commit -X main.buildDate=$build_date" \
              -o "dist/domain-check-linux-$arch" ./cmd/domain-check
          done
          file dist/domain-check-linux-* | tee /tmp/domain-check-file
          test "$(grep -c 'ELF 64-bit.*statically linked' /tmp/domain-check-file)" -eq 2
          test "$(./dist/domain-check-linux-amd64 --version)" = \
            'domain-check Go v0.0.0-test (commit 0123456789abcdef, built 2026-08-14T00:00:00Z)'
          (cd dist && sha256sum domain-check-linux-amd64 domain-check-linux-arm64 > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)
          test "$(wc -l < dist/SHA256SUMS)" -eq 2
      - name: Test installer on GNU and BusyBox
        run: |
          python3 -m http.server 18080 --directory dist >/tmp/domain-check-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            curl -fsS http://127.0.0.1:18080/SHA256SUMS >/dev/null && break
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:18080/SHA256SUMS >/dev/null
          docker run --rm --network host \
            --volume "$PWD/scripts/install-domain-check.sh:/tmp/install-domain-check.sh:ro" \
            debian:12-slim sh -euxc '
              apt-get update
              apt-get install --yes --no-install-recommends bash ca-certificates coreutils curl
              DOMAIN_CHECK_RELEASE_BASE=http://127.0.0.1:18080 \
                bash /tmp/install-domain-check.sh
              /usr/local/bin/domain-check --version |
                grep -F "domain-check Go v0.0.0-test (commit 0123456789abcdef, built 2026-08-14T00:00:00Z)"
            '
          docker run --rm --network host \
            --volume "$PWD/scripts/install-domain-check.sh:/tmp/install-domain-check.sh:ro" \
            alpine:3.21 sh -euxc '
              apk add --no-cache bash ca-certificates curl
              DOMAIN_CHECK_RELEASE_BASE=http://127.0.0.1:18080 \
                bash /tmp/install-domain-check.sh
              /usr/local/bin/domain-check --version |
                grep -F "domain-check Go v0.0.0-test (commit 0123456789abcdef, built 2026-08-14T00:00:00Z)"
            '
