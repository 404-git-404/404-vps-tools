name: Shell checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check committed diff
        run: git diff --check HEAD^ HEAD

      - name: Check script files
        run: |
          scripts=(
            debian-init.sh
            request-cloudflare-certificate.sh
            tests/gg-status-container-test.sh
            tests/gg-status-test.sh
            tests/node-config-wizard-test.sh
            tests/smartdns-test.sh
          )
          for script in "${scripts[@]}"; do
            test -s "$script"
            if grep -q $'\r' "$script"; then
              echo "$script contains CRLF." >&2
              exit 1
            fi
            bash -n "$script"
          done
          for executable_script in \
            tests/gg-status-container-test.sh \
            tests/gg-status-test.sh \
            tests/node-config-wizard-test.sh \
            tests/smartdns-test.sh; do
            test -x "$executable_script"
          done
          for script in yt-region gg-status alpine-init.sh; do
            test -s "$script"
            if grep -q $'\r' "$script"; then
              echo "$script contains CRLF." >&2
              exit 1
            fi
            sh -n "$script"
          done

      - name: Extract and check embedded tools
        run: |
          sed -n "/^  bash \/dev\/fd\/3 3<<'SINGBOX_WIZARD'$/,/^SINGBOX_WIZARD$/ { /SINGBOX_WIZARD/d; p; }" debian-init.sh > /tmp/node-wizard.sh
          awk '/<<.CFEOF./ { capture=1; next } capture && $0 == "CFEOF" { exit } capture { print }' debian-init.sh > /tmp/update-cloudflare-ufw
          for script in /tmp/node-wizard.sh /tmp/update-cloudflare-ufw; do
            test -s "$script"
            bash -n "$script"
          done

      - name: Check repository invariants
        run: |
          test ! -e configs/smartdns.conf
          test ! -e smartdns.conf
          legacy_name="Reality""Checker"
          legacy_command="reality""-checker"
          if grep -RniE --exclude-dir=.git \
            "${legacy_name}|${legacy_command}|V2RaySSR/${legacy_name}" .; then
            exit 1
          fi
          if grep -Eq '(/lib|/usr/lib)/systemd/system/smartdns\.service' \
            debian-init.sh; then
            exit 1
          fi
          if grep -Fq 'https://api.github.com/repos/pymumu/smartdns/releases/latest' \
            debian-init.sh; then
            exit 1
          fi
          if grep -Fq 'install -y ca-certificates dnsutils smartdns' \
            debian-init.sh; then
            exit 1
          fi

      - name: Check README and entry points
        run: |
          test "$(head -n 1 README.md)" = '```bash'
          grep -Fxq 'bash <(curl -fsSL https://raw.githubusercontent.com/404-git-404/404-vps-tools/main/debian-init.sh)' README.md
          grep -Fxq 'wget -qO alpine-init.sh https://raw.githubusercontent.com/404-git-404/404-vps-tools/main/alpine-init.sh && sh alpine-init.sh' README.md
          test ! -e 404notfound.sh
          test ! -e node-config-wizard.sh
          test ! -e scripts/update-smartdns.sh
          bash debian-init.sh --help

      - name: Install ShellCheck, jq, and mawk
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck jq mawk

      - name: Run offline tests
        run: |
          mkdir -p "$RUNNER_TEMP/mawk-bin"
          ln -s "$(command -v mawk)" "$RUNNER_TEMP/mawk-bin/awk"
          PATH="$RUNNER_TEMP/mawk-bin:$PATH" awk -W version
          PATH="$RUNNER_TEMP/mawk-bin:$PATH" bash tests/gg-status-test.sh
          GG_STATUS_SHELL=/bin/dash PATH="$RUNNER_TEMP/mawk-bin:$PATH" bash tests/gg-status-test.sh
          PATH="$RUNNER_TEMP/mawk-bin:$PATH" bash tests/node-config-wizard-test.sh
          PATH="$RUNNER_TEMP/mawk-bin:$PATH" bash tests/smartdns-test.sh

      - name: Run Debian and Alpine containers
        run: |
          bash tests/gg-status-container-test.sh

      - name: Run ShellCheck
        run: |
          shellcheck \
            debian-init.sh \
            request-cloudflare-certificate.sh \
            tests/gg-status-container-test.sh \
            tests/gg-status-test.sh \
            tests/node-config-wizard-test.sh \
            tests/smartdns-test.sh \
            /tmp/node-wizard.sh \
            /tmp/update-cloudflare-ufw
          shellcheck -s sh yt-region gg-status alpine-init.sh
