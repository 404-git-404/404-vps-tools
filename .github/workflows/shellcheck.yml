name: Shell checks

# Tag pushes are checked through release.yml, which calls this workflow before publishing.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check committed diff
        run: git diff --check HEAD^ HEAD

      - name: Check script files
        run: |
          scripts=(
            debian-init.sh
            request-cloudflare-certificate.sh
            tests/gg-status-container-test.sh
            tests/gg-status-test.sh
            tests/fail2ban-test.sh
            tests/smartdns-test.sh
            tests/ssh-public-key-test.sh
            tests/swap-test.sh
            tests/cleanup-test.sh
            tests/ufw-sync-test.sh
            tests/system-update-test.sh
            tests/init-flow-test.sh
            tests/singbox-upgrade-test.sh
            tests/process-helper.sh
            tests/ipv6-boot-state-test.sh
            tests/hardening-test.sh
            tests/qemu-guest-agent-test.sh
            tests/ci-workflow-test.sh
            tests/dns-precheck-test.sh
            tests/sysctl-dir-container-test.sh
            tests/cloudflare-ips-test.sh
            tests/version-test.sh
            tests/ui-test.sh
            tests/release-checks-test.sh
            tests/readme-commands-test.sh
            .github/scripts/ci-fetch.sh
            .github/scripts/ci-required-checks.sh
            .github/scripts/release-checks.sh
            .github/scripts/readme-commands.sh
            .github/scripts/release-notes.sh
          )
          for script in "${scripts[@]}"; do
            test -s "$script"
            if grep -q $'\r' "$script"; then
              echo "$script contains CRLF." >&2
              exit 1
            fi
            bash -n "$script"
          done
          for executable_script in \
            tests/fail2ban-test.sh \
            tests/gg-status-container-test.sh \
            tests/gg-status-test.sh \
            tests/smartdns-test.sh \
            tests/ssh-public-key-test.sh \
            tests/swap-test.sh \
            tests/cleanup-test.sh \
            tests/ufw-sync-test.sh \
            tests/system-update-test.sh \
            tests/init-flow-test.sh \
            tests/singbox-upgrade-test.sh \
            tests/ipv6-boot-state-test.sh \
            tests/hardening-test.sh \
            tests/qemu-guest-agent-test.sh \
            tests/dns-precheck-test.sh \
            tests/sysctl-dir-container-test.sh \
            tests/cloudflare-ips-test.sh \
            tests/version-test.sh \
            tests/ui-test.sh \
            tests/release-checks-test.sh \
            tests/readme-commands-test.sh \
            .github/scripts/release-checks.sh \
            .github/scripts/readme-commands.sh \
            .github/scripts/release-notes.sh \
            tests/ci-workflow-test.sh; do
            test -x "$executable_script"
          done
          for script in yt-region gg-status alpine-init.sh; do
            test -s "$script"
            if grep -q $'\r' "$script"; then
              echo "$script contains CRLF." >&2
              exit 1
            fi
            sh -n "$script"
          done

      - name: Extract and check embedded tools
        run: |
          awk '/<<.CFEOF./ { capture=1; next } capture && $0 == "CFEOF" { exit } capture { print }' debian-init.sh > /tmp/update-cloudflare-ufw
          for script in /tmp/update-cloudflare-ufw; do
            test -s "$script"
            bash -n "$script"
          done
          sed -n '/^import gettext$/,/^UFW_NUMBERS$/ { /^UFW_NUMBERS$/d; p; }' debian-init.sh > /tmp/ufw-numbers.py
          test -s /tmp/ufw-numbers.py
          python3 -m py_compile /tmp/ufw-numbers.py

      - name: Check repository invariants
        run: |
          test ! -e configs/smartdns.conf
          test ! -e smartdns.conf
          legacy_name="Reality""Checker"
          legacy_command="reality""-checker"
          if grep -RniE --exclude-dir=.git \
            "${legacy_name}|${legacy_command}|V2RaySSR/${legacy_name}" .; then
            exit 1
          fi
          if grep -Eq '(/lib|/usr/lib)/systemd/system/smartdns\.service' \
            debian-init.sh; then
            exit 1
          fi
          if grep -Fq 'https://api.github.com/repos/pymumu/smartdns/releases/latest' \
            debian-init.sh; then
            exit 1
          fi
          if grep -Fq 'install -y ca-certificates dnsutils smartdns' \
            debian-init.sh; then
            exit 1
          fi

      - name: Check README and entry points
        run: |
          test "$(head -n 1 README.md)" = '```bash'
          test "$(bash .github/scripts/readme-commands.sh README.md | wc -l)" -eq 3
          if grep -n 'raw.githubusercontent.com' README.md; then exit 1; fi
          test ! -e 404notfound.sh
          test ! -e node-config-wizard.sh
          test ! -e scripts/update-smartdns.sh
          bash debian-init.sh --help

      - name: Install ShellCheck, jq, and mawk
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck jq mawk openssh-client

      - name: Run offline tests
        run: |
          mkdir -p "$RUNNER_TEMP/mawk-bin"
          ln -s "$(command -v mawk)" "$RUNNER_TEMP/mawk-bin/awk"
          PATH="$RUNNER_TEMP/mawk-bin:$PATH" awk -W version
          PATH="$RUNNER_TEMP/mawk-bin:$PATH" bash tests/gg-status-test.sh
          GG_STATUS_SHELL=/bin/dash PATH="$RUNNER_TEMP/mawk-bin:$PATH" bash tests/gg-status-test.sh
          PATH="$RUNNER_TEMP/mawk-bin:$PATH" bash tests/smartdns-test.sh
          PATH="$RUNNER_TEMP/mawk-bin:$PATH" bash tests/fail2ban-test.sh
          PATH="$RUNNER_TEMP/mawk-bin:$PATH" bash tests/ssh-public-key-test.sh
          PATH="$RUNNER_TEMP/mawk-bin:$PATH" bash tests/swap-test.sh
          PATH="$RUNNER_TEMP/mawk-bin:$PATH" bash tests/cleanup-test.sh
          PATH="$RUNNER_TEMP/mawk-bin:$PATH" bash tests/ufw-sync-test.sh
          PATH="$RUNNER_TEMP/mawk-bin:$PATH" bash tests/system-update-test.sh
          PATH="$RUNNER_TEMP/mawk-bin:$PATH" bash tests/init-flow-test.sh
          PATH="$RUNNER_TEMP/mawk-bin:$PATH" bash tests/singbox-upgrade-test.sh
          sudo env PATH="$RUNNER_TEMP/mawk-bin:$PATH" bash tests/hardening-test.sh
          PATH="$RUNNER_TEMP/mawk-bin:$PATH" bash tests/qemu-guest-agent-test.sh
          PATH="$RUNNER_TEMP/mawk-bin:$PATH" bash tests/dns-precheck-test.sh
          PATH="$RUNNER_TEMP/mawk-bin:$PATH" bash tests/ci-workflow-test.sh
          PATH="$RUNNER_TEMP/mawk-bin:$PATH" bash tests/cloudflare-ips-test.sh
          PATH="$RUNNER_TEMP/mawk-bin:$PATH" bash tests/version-test.sh
          PATH="$RUNNER_TEMP/mawk-bin:$PATH" bash tests/ui-test.sh
          PATH="$RUNNER_TEMP/mawk-bin:$PATH" bash tests/release-checks-test.sh

      - name: Validate Actions workflows and inline shell
        timeout-minutes: 3
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Verify real Swap activation on the runner VM
        run: sudo bash tests/swap-test.sh --kernel

      - name: Verify boot-time IPv6 state with the real systemd-sysctl
        run: sudo bash tests/ipv6-boot-state-test.sh --require

      - name: Verify boot-time IPv6 state on Debian 12 and 13 (systemd 252 and 257)
        run: |
          for debian_version in 12 13; do
            docker run --rm --privileged --volume "$PWD:/repo:ro" "debian:$debian_version" \
              bash -Eeuo pipefail -c '
                export DEBIAN_FRONTEND=noninteractive
                apt-get update -qq
                apt-get install -y -qq --no-install-recommends systemd util-linux >/dev/null
                /usr/lib/systemd/systemd-sysctl --version | head -1
                bash /repo/tests/ipv6-boot-state-test.sh --require'
          done

      - name: Run Debian and Alpine containers
        run: |
          bash tests/gg-status-container-test.sh

      - name: Run the README commands on Debian 12, Debian 13 and Alpine
        run: bash tests/readme-commands-test.sh

      - name: Verify QEMU Guest Agent removal on Debian 12 and 13
        run: |
          for debian_version in 12 13; do
            docker run --rm --network none --volume "$PWD:/repo:ro" "debian:$debian_version" \
              bash /repo/tests/qemu-guest-agent-test.sh --package-manager
          done

      - name: Verify read-only audit on Debian 12 and 13
        run: |
          for debian_version in 12 13; do
            docker run --rm --read-only --network none --volume "$PWD:/repo:ro" "debian:$debian_version" \
              bash /repo/debian-init.sh --audit
          done

      - name: Verify Exim purge and collateral confirmation on Debian 12 and 13
        run: |
          for debian_version in 12 13; do
            docker run --rm --network none --volume "$PWD:/repo:ro" "debian:$debian_version" \
              bash /repo/tests/hardening-test.sh --exim4-package-manager
          done

      - name: Verify TCP tuning and IPv6 override without /etc/sysctl.d on Debian 12 and 13
        run: |
          for debian_version in 12 13; do
            docker run --rm --env VPS_TEST_CONTAINER=1 --volume "$PWD:/repo:ro" "debian:$debian_version" \
              bash -Eeuo pipefail -c '
                export DEBIAN_FRONTEND=noninteractive
                apt-get update -qq
                apt-get install -y -qq --no-install-recommends procps util-linux >/dev/null
                # A minimal image: the directories the installer writes into do not exist.
                rm -rf /etc/sysctl.d /etc/modules-load.d
                test ! -e /etc/sysctl.d
                bash /repo/tests/sysctl-dir-container-test.sh'
          done

      - name: Run ShellCheck
        run: |
          shellcheck \
            tests/process-helper.sh \
            debian-init.sh \
            request-cloudflare-certificate.sh \
            tests/gg-status-container-test.sh \
            tests/fail2ban-test.sh \
            tests/gg-status-test.sh \
            tests/smartdns-test.sh \
            tests/ssh-public-key-test.sh \
            tests/swap-test.sh \
            tests/cleanup-test.sh \
            tests/ufw-sync-test.sh \
            tests/system-update-test.sh \
            tests/init-flow-test.sh \
            tests/singbox-upgrade-test.sh \
            tests/ipv6-boot-state-test.sh \
            tests/hardening-test.sh \
            tests/qemu-guest-agent-test.sh \
            tests/ci-workflow-test.sh \
            tests/dns-precheck-test.sh \
            tests/sysctl-dir-container-test.sh \
            tests/cloudflare-ips-test.sh \
            tests/version-test.sh \
            tests/ui-test.sh \
            tests/release-checks-test.sh \
            tests/readme-commands-test.sh \
            .github/scripts/ci-fetch.sh \
            .github/scripts/ci-required-checks.sh \
            .github/scripts/release-checks.sh \
            .github/scripts/readme-commands.sh \
            .github/scripts/release-notes.sh \
            /tmp/update-cloudflare-ufw
          shellcheck -s sh yt-region gg-status alpine-init.sh
